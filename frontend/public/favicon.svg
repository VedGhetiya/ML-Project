<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b0f19" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="50" cy="50" r="32" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="4 2" opacity="0.4" />
  <!-- Eye contour with pulse wave inside -->
  <path d="M 20 50 Q 50 24 80 50 Q 50 76 20 50 Z" stroke="url(#glowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- ECG pulse wave through pupil -->
  <path d="M 28 50 L 40 50 L 45 36 L 52 64 L 58 42 L 64 50 L 72 50" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#ec4899" />
</svg>